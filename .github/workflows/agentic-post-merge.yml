name: Agentic Post-Merge Hooks

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  # ── Post-hook 1: Deployment health check ──────────────────────────────────
  deployment-verify:
    name: "Agent: Verify Deployment Health"
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOYMENT_URL != '' }}

    steps:
      - name: Wait for deployment to stabilise
        run: sleep 30

      - name: Check health endpoint
        run: |
          HEALTH_URL="${{ vars.DEPLOYMENT_URL }}/health"
          RESPONSE=$(curl -sf --max-time 10 "$HEALTH_URL" || echo '{"status":"error"}')
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))")
          DB=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('db','unknown'))")
          if [ "$STATUS" = "ok" ] && [ "$DB" = "connected" ]; then
            echo "✓ Deployment healthy — status=$STATUS, db=$DB"
          else
            echo "✗ Deployment health check failed — response: $RESPONSE"
            exit 1
          fi

  # ── Post-hook 2: Smoke test against staging ────────────────────────────────
  smoke-test:
    name: "Agent: Post-Deploy Smoke Test"
    runs-on: ubuntu-latest
    needs: [deployment-verify]
    if: ${{ vars.DEPLOYMENT_URL != '' && always() && needs.deployment-verify.result == 'success' }}

    steps:
      - uses: actions/checkout@v7

      - name: Run smoke test
        run: |
          BASE="${{ vars.DEPLOYMENT_URL }}"
          echo "Testing health endpoint..."
          STATUS=$(curl -sf "$BASE/health" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          [ "$STATUS" = "ok" ] && echo "✓ /health" || (echo "✗ /health" && exit 1)

          echo "Testing auth endpoint (should return 401 without credentials)..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/api/departments")
          [ "$CODE" = "401" ] && echo "✓ /api/departments → 401" || (echo "✗ Expected 401, got $CODE" && exit 1)

          echo "All smoke tests passed ✓"
