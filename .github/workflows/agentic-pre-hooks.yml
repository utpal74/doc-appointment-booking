name: Agentic Pre-Merge Hooks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ── Pre-hook 1: Security scan ──────────────────────────────────────────────
  security-scan:
    name: "Agent: Security Scan"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          # Fail if any .env file (not .env.example) is committed
          if git ls-files | grep -E '^\.env$' | grep -v '\.example'; then
            echo "ERROR: .env file is committed to the repository!"
            exit 1
          fi
          # Fail if any file contains what looks like a real Twilio SID
          if grep -rn 'AC[a-f0-9]\{32\}' --include='*.js' --include='*.ts' --include='*.json' src/ 2>/dev/null; then
            echo "ERROR: Potential hardcoded Twilio SID found!"
            exit 1
          fi
          echo "No hardcoded secrets detected."
        working-directory: backend

  # ── Pre-hook 2: Doc quality gate ──────────────────────────────────────────
  doc-quality-gate:
    name: "Agent: Documentation Quality"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run documentation quality check
        id: doc_check
        run: |
          node scripts/check-docs.js 2>&1 | tee /tmp/doc-check-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post doc-check result as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/doc-check-output.txt', 'utf8');
            const passed = output.includes('All document and code checks passed');
            const match = output.match(/RESULT: (\d+) \/ (\d+) checks passed/);
            const summary = match ? `${match[1]} / ${match[2]} doc checks` : 'unknown';
            const icon = passed ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${icon} Document Quality Gate — ${summary}\n\n<details><summary>Full output</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`
            });

  # ── Pre-hook 3: PR description completeness check ─────────────────────────
  pr-description-check:
    name: "Agent: PR Description Completeness"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Check required PR sections
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';
            const required = ['## Summary', '## Changes Made', '## Test Evidence', '## Known Limitations', '## Reviewer Checklist'];
            const missing = required.filter(s => !body.includes(s));
            if (missing.length > 0) {
              core.setFailed(`PR description is missing required sections:\n${missing.map(s => '  - ' + s).join('\n')}`);
            } else {
              core.info('All required PR sections are present ✓');
            }
